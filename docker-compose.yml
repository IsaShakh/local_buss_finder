name: local-business-intelligence

x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-dev-only-change-me}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  DATABASE_URL: postgis://${POSTGRES_USER:-lbi}:${POSTGRES_PASSWORD:-lbi-dev-only}@postgres:5432/${POSTGRES_DB:-local_business_intelligence}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_TASK_IGNORE_RESULT: "true"
  S3_ENDPOINT_URL: http://garage:3900
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GK00000000000000000000000000000000}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-garage-dev-only-secret-key-change-me}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-local-business-intelligence}
  S3_REGION_NAME: ${S3_REGION_NAME:-garage}
  S3_FORCE_PATH_STYLE: "true"
  OVERPASS_URL: ${OVERPASS_URL:-}
  OSM_DATASET_VERSION: ${OSM_DATASET_VERSION:-}
  SOURCE_USER_AGENT: "${SOURCE_USER_AGENT:-local-business-intelligence/0.1 (+https://example.invalid/contact)}"
  SENTRY_DSN: ${SENTRY_DSN:-}

x-backend-depends-on: &backend-depends-on
  postgres: {condition: service_healthy}
  redis: {condition: service_healthy}
  garage: {condition: service_healthy}

services:
  postgres:
    build:
      context: ./infrastructure/postgres
    image: local-business-intelligence/postgis:17.11-3.6.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-local_business_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-lbi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lbi-dev-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    networks: [app]

  garage:
    image: ${GARAGE_IMAGE:-dxflrs/garage:v2.3.0}
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-GK00000000000000000000000000000000}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-garage-dev-only-secret-key-change-me}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET_NAME:-local-business-intelligence}
    ports:
      - "127.0.0.1:${S3_PORT:-3900}:3900"
      - "127.0.0.1:${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - ./infrastructure/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "stats", "-a"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [app]

networks:
  app: {}

volumes:
  postgres_data: {}
  redis_data: {}
  garage_meta: {}
  garage_data: {}
